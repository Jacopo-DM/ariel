# Vendored stubs, the LLM-maintained wiki, lock files and notebooks outputs are left alone.
exclude: ^(\.typings/|\.claude/wiki/|uv\.lock$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: local
    hooks:
      # Run from the project venv: `uv sync --all-groups` installs the tools.
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
      - id: ruff-format
        name: ruff-format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
      # Functional notebooks (tests/functional): see tests/functional/README.md.
      # At commit, only the notebooks in the commit; at push, all non-slow ones.
      - id: notebooks-commit
        name: notebooks (committed ones)
        entry: uv run --no-sync python tools/run_notebooks.py --timeout 300
        language: system
        files: ^tests/functional/.*\.ipynb$
      - id: notebooks-push
        name: notebooks (all, non-slow)
        entry: uv run --no-sync python tools/run_notebooks.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # pydoclint is left out on purpose: `uv run pydoclint src` still reports
      # findings (see PLAN.md, Known problems).

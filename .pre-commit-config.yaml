# Vendored stubs, the LLM-maintained wiki, lock files and notebooks outputs are left alone.
exclude: ^(\.typings/|\.claude/wiki/|uv\.lock$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: local
    hooks:
      # Run from the project venv: `uv sync --all-groups` installs the tools.
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
      - id: ruff-format
        name: ruff-format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
      # pydoclint is left out on purpose: `uv run pydoclint src` still reports
      # findings (see PLAN.md, Known problems).

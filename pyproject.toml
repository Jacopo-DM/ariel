[project]
name = "ariel"
version = "0.0.0"
description = "ARIEL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0" }
authors = [{ name = "jmdm", email = "jmdm.880@gmail.com" }]
classifiers = ["Development Status :: 2 - Pre-Alpha"]

dependencies = [
  "astropy>=8.0.2",
  "evotorch>=0.6.1",
  "ipykernel>=6.30.1",
  "jupyter>=1.1.1",
  "matplotlib>=3.9.4",
  "mujoco>=3.16.0",
  "networkx>=3.2.1",
  "nevergrad>=1.0.12",
  "numpy>=2.0.2",
  "opencv-python-headless==4.11.0.86",
  "pillow>=11.3.0",
  "polars>=1.35.2",
  "pydantic>=2.11.9",
  "pydantic-settings>=2.10.1",
  "python-fcl>=0.7.0.11",
  "rich>=14.1.0",
  "sqlalchemy>=2.0.43",
  "sqlmodel>=0.0.25",
  "torch>=2.8.0",
  "trimesh>=4.11.5",
]


[project.urls]
Homepage = "https://github.com/ci-group/ariel"
Repository = "https://github.com/ci-group/ariel"
Documentation = "https://ariel.readthedocs.io"
Changelog = "https://github.com/ci-group/ariel/releases"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "numpy-quaternion>=2023.0.3",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-modern>=0.7.4",
    "pre-commit>=4.7.0",
    "pydoclint>=0.11.1",
    "pyright>=1.1.414",
    "ruff==0.17.*",
    "ty==0.0.90",
]
docs = [
  "furo>=2025.12.19",
  "jupyter-sphinx>=0.5.3",
  "linkify-it-py>=2.0.3",
  "myst-parser>=3.0.1",
  "nbsphinx>=0.9.7",
  "sphinx-autoapi>=3.6.0",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-click>=6.0.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
]
stubs = [
  "opencv-stubs>=0.1.0",
  "pandas-stubs>=2.3.2.250926",
  "types-networkx>=3.5.0.20250918",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["ariel", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pydoclint]
style = 'numpy'
exclude = '\.git'
arg-type-hints-in-docstring = false

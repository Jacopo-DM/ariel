name: "Checks: tests, lint, types"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check-out the Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"
          enable-cache: true

      # Python 3.12.9 comes from .python-version
      - name: Install the locked environment
        run: uv sync --all-groups --locked

      - name: Ruff format
        run: uv run --locked ruff format --check

      - name: Ruff lint (ruff.toml has fix = false; --no-fix keeps it read-only)
        run: uv run --locked ruff check --no-fix

      - name: Mypy
        run: uv run --locked mypy .

      # pytest.ini sets 100% branch coverage over src and tests
      - name: Tests and coverage
        run: uv run --locked pytest -q -p no:cacheprovider

      # Each script in examples/ runs briefly; the ones that render are
      # skipped here, since the runner has no OpenGL backend
      - name: Examples
        run: uv run --locked python tools/run_examples.py

      # Pyright reads stubs from .typings/, which CI does not generate
      - name: Pyright (informational)
        run: uv run --locked pyright src tests
        continue-on-error: true
